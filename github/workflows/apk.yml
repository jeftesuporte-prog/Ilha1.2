name: APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ilha_cpp.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle -p ilha_cpp/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ilha-apk
          path: ilha_cpp/android/app/build/outputs/apk/debug/*.apk
